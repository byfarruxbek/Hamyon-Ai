services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://hamyon:${POSTGRES_PASSWORD:-change-this-password}@db:5432/hamyon
    volumes:
      - hamyon-data:/app/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hamyon
      POSTGRES_USER: hamyon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamyon"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hamyon-data:
  postgres-data:
