[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamyon-ai"
version = "1.0.0"
description = "Uzbek personal finance Telegram bot"
requires-python = ">=3.11,<3.15"
dependencies = ["aiogram>=3.13,<4", "SQLAlchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20", "asyncpg>=0.29", "alembic>=1.13", "pydantic-settings>=2.5", "openai>=1.50", "python-dotenv>=1.0", "python-dateutil>=2.9"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*"]
